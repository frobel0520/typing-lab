name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check Electron version syntax
        run: |
          npm run check
          node --check electron/main.cjs
          node --check electron/preload.cjs

      - name: Check native version syntax
        run: python -m py_compile native/*.py
